name: QA

on:
  push:
  pull_request:
  workflow_dispatch:        # run manually from the Actions tab
  schedule:
    - cron: "30 3 * * 1"    # weekly LLM regression run (Mon 09:00 IST)

jobs:
  unit-and-api:
    name: Unit + API tests (Pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: qa/requirements-qa.txt }
      - run: pip install -r requirements-qa.txt
      - run: pytest --junitxml=reports/pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pytest-results, path: qa/reports/ }

  postman:
    name: API contract tests (Postman / Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r qa/requirements-qa.txt
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/openapi.json && break; sleep 1; done
      - name: Run collection
        working-directory: qa/postman
        run: npx --yes newman run PrepareAI.postman_collection.json --reporters cli,junit --reporter-junit-export ../reports/newman-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: newman-results, path: qa/reports/ }

  e2e:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r qa/requirements-qa.txt && python -m playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          nohup npx vite --port 5173 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 && break; sleep 1; done
      - working-directory: qa
        run: pytest -m e2e tests/e2e --tracing retain-on-failure --output reports/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-traces, path: qa/reports/ }

  llm-eval:
    name: LLM evaluation (DeepEval + golden dataset)
    # Costs API calls, so only on manual runs and the weekly schedule.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: qa } }
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_DELAY: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-qa.txt
      - name: Check API key secret
        run: test -n "$GEMINI_API_KEY" || (echo "Add GEMINI_API_KEY in Settings > Secrets > Actions" && exit 1)
      - name: Evaluation report
        run: python tests/llm_eval/run_eval_report.py && cat reports/llm_eval_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardrail tests
        run: pytest -m llm tests/llm_eval/test_guardrails.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: llm-eval-report, path: qa/reports/ }
